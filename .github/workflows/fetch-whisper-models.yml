name: Fetch Whisper models

on:
  push:
    branches:
      - temp-transcription-model-20260728
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download multilingual Whisper Tiny models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -L --fail --retry 4 --retry-delay 5 \
            -o models/ggml-tiny.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin?download=true'
          curl -L --fail --retry 4 --retry-delay 5 \
            -o models/ggml-tiny-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin?download=true'
          sha256sum models/* | tee models/SHA256SUMS.txt
          ls -lh models

      - name: Upload Whisper Tiny models
        uses: actions/upload-artifact@v4
        with:
          name: whisper-tiny-ko
          path: models/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
