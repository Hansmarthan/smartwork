name: Temporary Whisper Fast Models

on:
  push:
    branches:
      - tmp-transcription-runtime-20260729
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download multilingual base and tiny quantized models
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          curl -L --fail --retry 3 -o ggml-tiny-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin
          sha256sum ggml-base-q5_1.bin ggml-tiny-q5_1.bin | tee SHA256SUMS.txt
          ls -lh ggml-*.bin
      - name: Upload base model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5_1-model
          path: |
            ggml-base-q5_1.bin
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
      - name: Upload tiny model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-tiny-q5_1-model
          path: |
            ggml-tiny-q5_1.bin
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
